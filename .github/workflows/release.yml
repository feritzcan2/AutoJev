name: release
on:
  push:
    tags: ['v*']
  # A version bump in package.json on main is released once CI passes for that commit.
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable version tag
        required: true
        type: string
      skip_tests:
        description: Explicitly publish without tests or prior CI evidence
        required: false
        default: false
        type: boolean
      platforms:
        description: Comma-separated platforms to build and publish
        required: false
        default: macos,windows
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: jobloop-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
env:
  JOBLOOP_RELEASE_PLATFORMS: ${{ inputs.platforms || 'macos,windows' }}
  JOBLOOP_SKIP_TESTS: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_tests && '1' || '0' }}
jobs:
  resolve:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Select build platforms
        id: matrix
        env:
          MACOS_RUNNER: ${{ vars.JOBLOOP_MACOS_RUNNER || '["macos-15"]' }}
          LINUX_RUNNER: ${{ vars.JOBLOOP_LINUX_RUNNER || '["ubuntu-24.04"]' }}
          WINDOWS_RUNNER: ${{ vars.JOBLOOP_WINDOWS_RUNNER || '["windows-2025"]' }}
        shell: bash
        run: |
          set -euo pipefail
          include='[]'
          for platform in ${JOBLOOP_RELEASE_PLATFORMS//,/ }; do
            case "$platform" in
              macos) runner="$MACOS_RUNNER" ;;
              linux) runner="$LINUX_RUNNER" ;;
              windows) runner="$WINDOWS_RUNNER" ;;
              *) echo "Unknown platform: $platform" >&2; exit 1 ;;
            esac
            include="$(jq -c --arg p "$platform" --arg r "$runner" '. + [{platform: $p, runner: $r}]' <<< "$include")"
          done
          echo "matrix={\"include\":$include}" >> "$GITHUB_OUTPUT"
      - name: Resolve release tag, tagging a new main version
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != workflow_run ]; then
            echo "tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="$(gh api "repos/$GITHUB_REPOSITORY/contents/package.json?ref=$HEAD_SHA" -H 'Accept: application/vnd.github.raw' | jq -r .version)"
          tag="v$version"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version $version is not a stable release; nothing to publish."
            exit 0
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "$tag already exists; nothing to publish."
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$HEAD_SHA" >/dev/null
          echo "Tagged $HEAD_SHA as $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
  confirm-candidate:
    needs: resolve
    if: needs.resolve.outputs.tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      JOBLOOP_RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.3
      - name: Verify immutable candidate and requested validation mode
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-candidate.mjs
  build:
    needs: [resolve, confirm-candidate]
    environment: production
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 120
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      JOBLOOP_RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.confirm-candidate.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      - name: Audit application production dependencies
        run: pnpm audit --prod
      - name: Package signed and notarized macOS universal app
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_API_KEY_BASE64: ${{ secrets.MACOS_API_KEY_BASE64 }}
          MACOS_API_KEY_ID: ${{ secrets.MACOS_API_KEY_ID }}
          MACOS_API_ISSUER: ${{ secrets.MACOS_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/sign-macos-release.sh
      - name: Package Linux
        if: runner.os == 'Linux'
        run: pnpm package
      - name: Package Windows
        if: runner.os == 'Windows'
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: pnpm package
      - name: Smoke final application
        if: env.JOBLOOP_SKIP_TESTS != '1'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a pnpm test:packaged; else pnpm test:packaged; fi
      - run: node scripts/release-assets.mjs release-assets --collect
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.platform }}
          path: release-assets/*
          retention-days: 1
          if-no-files-found: error
  publish:
    needs: [resolve, confirm-candidate, build]
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      JOBLOOP_RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.confirm-candidate.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.3
      - name: Revalidate candidate before publication
        env:
          GH_TOKEN: ${{ github.token }}
          JOBLOOP_CANDIDATE_SHA: ${{ needs.confirm-candidate.outputs.sha }}
        run: node scripts/release-candidate.mjs
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Package complete source including pinned TermLoop sources
        shell: bash
        run: |
          version="${JOBLOOP_RELEASE_TAG#v}"
          git archive --format=tar.gz --prefix="jobloop-$version/" HEAD -o "release-assets/jobloop-source-$version.tar.gz"
      - name: Verify full artifact set and checksums
        run: node scripts/release-assets.mjs release-assets
      - name: Publish complete GitHub Release and update manifests
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$JOBLOOP_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            test "$(gh release view "$JOBLOOP_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true || { echo 'A published release is immutable; bump the version.' >&2; exit 1; }
          else
            gh release create "$JOBLOOP_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "$JOBLOOP_RELEASE_TAG" --generate-notes
          fi
          gh release upload "$JOBLOOP_RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release view "$JOBLOOP_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$RUNNER_TEMP/release-notes.md"
          if [ "$JOBLOOP_SKIP_TESTS" = 1 ]; then
            printf '\n\nTests were skipped for this explicitly requested manual release. Native builds, dependency audits, macOS signing/notarization and artifact checksums completed.\n' >> "$RUNNER_TEMP/release-notes.md"
          fi
          gh release edit "$JOBLOOP_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest --notes-file "$RUNNER_TEMP/release-notes.md"
