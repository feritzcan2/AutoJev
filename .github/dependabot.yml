version: 2
updates:
  # One grouped weekly PR keeps transitive advisories from piling up between releases.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    # Major upgrades (Electron, zod, ...) need a deliberate migration, not a weekly PR.
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
